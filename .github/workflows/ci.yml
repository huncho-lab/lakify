# CI pipeline for the Lakify API.
#
# Every push and pull request to main runs two jobs:
#   1. test  - lint, unit/integration tests and the 80 % coverage gate
#   2. build - build the Docker image, start it, wait for the HEALTHCHECK
#              and smoke-test the live endpoints, then deploy it to a
#              throwaway Kubernetes (Kind) cluster with the k8s/ manifests
#              and test the rollout, Service, self-healing and a rolling update
# The build job only runs when tests pass, so a broken commit never
# produces an image.
#
# On pushes to main (not pull requests), the image that passed all of the
# above is then pushed to GitHub Container Registry as
#   ghcr.io/<owner>/lakify-api:sha-<commit>  (immutable, one per commit)
#   ghcr.io/<owner>/lakify-api:latest        (moves to the newest main build)
# Pushing the tested image itself, rather than rebuilding, guarantees the
# registry holds exactly what was tested.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: # allows a manual run from the Actions tab

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test with coverage gate (80 %)
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: api/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build and smoke-test image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # packages: write lets this job push to GHCR with the built-in token.
    # Pull requests never reach the push steps (see PUBLISH below).
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: lakify-api:ci-${{ github.sha }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/lakify-api
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Read version from package.json
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: api
          load: true # keep the image in the runner's Docker so it can be run
          push: false # the tested image is pushed by a later step on main
          tags: ${{ env.IMAGE }}
          # Links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          docker image ls "$IMAGE" --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start container
        run: docker run -d --name lakify -p 3000:3000 "$IMAGE"

      - name: Wait for HEALTHCHECK to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lakify)
            echo "Attempt $i: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          echo "::error::Container did not become healthy"
          docker logs lakify
          exit 1

      - name: Smoke-test endpoints
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          base=http://localhost:3000

          curl -fsS "$base/health" | grep -q '"status":"ok"'
          curl -fsS "$base/ready"  | grep -q '"status":"ready"'

          version=$(curl -fsS "$base/version")
          echo "/version -> $version"
          echo "$version" | grep -q "\"version\":\"$EXPECTED_VERSION\""
          echo "$version" | grep -q "\"commit\":\"$EXPECTED_SHA\""

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/listings" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI flat","address":"Király utca 20","district":"VI","rent":250000,"size":45,"rooms":2,"photos":["https://example.com/a.jpg"]}')
          test "$code" = "201"

          curl -fsS "$base/api/listings" | grep -q '"title":"CI flat"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/listings?district=XXX")" = "400"

          echo "All smoke tests passed"

      - name: Check the container runs as a non-root user
        run: test "$(docker exec lakify id -u)" != "0"

      - name: Check graceful shutdown
        run: |
          docker stop --time 10 lakify
          test "$(docker inspect --format '{{.State.ExitCode}}' lakify)" = "0"
          docker logs lakify 2>&1 | grep -q "SIGTERM received"

      - name: Show container logs on failure
        if: failure()
        run: docker logs lakify || true

      # ---- Kubernetes (Kind) ------------------------------------------------

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: lakify
          wait: 120s

      - name: Load the tested image into the cluster
        run: |
          docker tag "$IMAGE" lakify-api:ci
          kind load docker-image lakify-api:ci --name lakify

      - name: Deploy manifests and wait for the rollout
        working-directory: k8s
        run: |
          kubectl kustomize overlays/kind
          kubectl apply -k overlays/kind
          kubectl -n lakify rollout status deployment/lakify-api --timeout=120s
          kubectl -n lakify get deploy,rs,pods,svc -o wide

      - name: Check pod security settings
        run: |
          set -euo pipefail
          pod=$(kubectl -n lakify get pod -l app.kubernetes.io/name=lakify-api -o jsonpath='{.items[0].metadata.name}')
          test "$(kubectl -n lakify exec "$pod" -- id -u)" = "1000"
          # The root filesystem must be mounted read-only
          kubectl -n lakify exec "$pod" -- cat /proc/mounts | awk '$2=="/"{print $4}' | grep -q '^ro'
          # and /tmp (the emptyDir) must still be writable
          kubectl -n lakify exec "$pod" -- touch /tmp/ok
          echo "Pod runs as uid 1000 with a read-only root filesystem"

      - name: Smoke-test through the Kubernetes Service
        run: |
          set -euo pipefail
          kubectl -n lakify port-forward svc/lakify-api 8080:80 > /tmp/port-forward.log 2>&1 &
          pf=$!
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          echo

          base=http://localhost:8080
          curl -fsS "$base/ready" | grep -q '"status":"ready"'
          curl -fsS "$base/version" | grep -q "\"commit\":\"${GITHUB_SHA::7}\""
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/listings" \
            -H 'Content-Type: application/json' \
            -d '{"title":"K8s flat","address":"Andrássy út 1","district":"VI","rent":300000,"size":50,"rooms":2,"photos":["https://example.com/k.jpg"]}')" = "201"
          curl -fsS "$base/api/listings" | grep -q '"title":"K8s flat"'
          kill "$pf"
          echo "Service smoke tests passed"

      - name: Self-healing - delete the pod and wait for Kubernetes to replace it
        run: |
          set -euo pipefail
          old=$(kubectl -n lakify get pod -l app.kubernetes.io/name=lakify-api -o jsonpath='{.items[0].metadata.name}')
          start=$(date +%s)
          kubectl -n lakify delete pod "$old" --wait=false
          for i in $(seq 1 60); do
            new=$(kubectl -n lakify get pod -l app.kubernetes.io/name=lakify-api \
              -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | grep -v "^$old$" || true)
            if [ -n "$new" ]; then
              echo "Replacement pod $new ready after $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::No replacement pod became ready"; exit 1

      # maxUnavailable: 0 means the old pod is only removed once the new one
      # passes its readiness probe.
      - name: Rolling update
        run: |
          set -euo pipefail
          start=$(date +%s)
          kubectl -n lakify rollout restart deployment/lakify-api
          kubectl -n lakify rollout status deployment/lakify-api --timeout=120s
          echo "Rolling update finished in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          kubectl -n lakify rollout history deployment/lakify-api

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl -n lakify get all -o wide || true
          kubectl -n lakify describe deployment lakify-api || true
          kubectl -n lakify describe pods -l app.kubernetes.io/name=lakify-api || true
          kubectl -n lakify logs -l app.kubernetes.io/name=lakify-api --all-containers --tail=100 || true
          kubectl -n lakify get events --sort-by=.lastTimestamp || true

      # ---- Publish (main only) -------------------------------------------

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image to GHCR
        if: env.PUBLISH == 'true'
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          # Registry paths must be lowercase.
          repo="${REGISTRY_IMAGE,,}"

          for tag in "sha-$SHORT_SHA" latest; do
            docker tag "$IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done

          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$repo:sha-$SHORT_SHA")
          {
            echo "### Published image"
            echo ""
            echo "| Tag | Reference |"
            echo "|---|---|"
            echo "| \`sha-$SHORT_SHA\` | \`$repo:sha-$SHORT_SHA\` |"
            echo "| \`latest\` | \`$repo:latest\` |"
            echo ""
            echo "Digest: \`$digest\`"
            echo ""
            echo "Pull it with: \`docker pull $repo:sha-$SHORT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
