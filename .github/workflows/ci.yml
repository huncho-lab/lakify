# CI/CD pipeline for Lakify (thesis Chapter 3, Figure 3.2).
#
#   1. ci      every push and pull request: lint the front end, lint and test
#              the API. A failure stops the pipeline before any image is built.
#   2. build   main only: build the API and front-end images, check them in
#              Docker, and publish them to GHCR tagged with the commit.
#   3. deploy  main only: create a Kind cluster, deploy the last known-good
#              version ("stable") with PostgreSQL, Prometheus and Grafana, roll
#              out the new version, verify it, roll back automatically if it
#              fails, and tag it as the new "stable" if it passes.
#
# Pull requests run only job 1, so they are tested but never deployed.
# A manual run (Actions -> CI -> Run workflow) can inject a fault into the new
# version to measure detection and recovery (Chapter 5).

name: CI/CD

on:
  push:
    branches: [main]
    paths: ['api/**', 'web/**', 'k8s/**', '.github/**']
  pull_request:
    branches: [main]
    paths: ['api/**', 'web/**', 'k8s/**', '.github/**']
  workflow_dispatch:
    inputs:
      fault:
        description: Fault to inject into the new version (evaluation experiments)
        type: choice
        options: [none, unready, error]
        default: none

# One run per branch at a time. Pull request runs are replaced by newer
# pushes; runs on main queue instead, so a deployment is never cut off halfway.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  ci:
    name: 1. Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Front end (FR2): HTML structure, CSS correctness, JavaScript syntax.
      - name: Lint front-end HTML
        run: npx --yes htmlhint@1.9.2 --config web/.htmlhintrc web/lakify.html

      - name: Lint front-end CSS
        run: npx --yes stylelint@18.0.0 --config web/.stylelintrc.json "web/**/*.css"

      - name: Check front-end JavaScript syntax
        run: node --check web/lakify.js

      # API (FR3).
      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Lint API
        working-directory: api
        run: npx eslint . --max-warnings 0

      - name: Test API with coverage gate (80 %)
        working-directory: api
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: api/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  build:
    name: 2. Build and publish images
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push images to GHCR with the built-in token

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Work out version and tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./api/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: api
          load: true
          push: false # pushed below, only after the checks pass
          tags: ${{ steps.meta.outputs.registry }}/lakify-api:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build front-end image
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          push: false
          tags: ${{ steps.meta.outputs.registry }}/lakify-web:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Report image sizes
        env:
          REG: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "### Images"
            echo ""
            echo "| Image | Size |"
            echo "|---|---|"
            for name in lakify-api lakify-web; do
              echo "| \`$REG/$name:$TAG\` | $(docker image ls "$REG/$name:$TAG" --format '{{.Size}}') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Quick container checks before anything is published: both images
      # start, report healthy, run as non-root, and nginx forwards /api/ to
      # the API (here the API uses its in-memory store; PostgreSQL is tested
      # in the deploy job).
      - name: Start both containers on a test network
        env:
          REG: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker network create lakify-ci
          docker run -d --name api --network lakify-ci "$REG/lakify-api:$TAG"
          docker run -d --name web --network lakify-ci -p 8080:8080 -e API_UPSTREAM=api:3000 "$REG/lakify-web:$TAG"

      - name: Wait for both HEALTHCHECKs to report healthy
        run: |
          for c in api web; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$c")
              [ "$status" = healthy ] && { echo "$c healthy after $i checks"; break; }
              [ "$status" = unhealthy ] && break
              sleep 2
            done
            [ "$status" = healthy ] || { echo "::error::$c did not become healthy"; docker logs "$c"; exit 1; }
          done

      - name: Smoke-test the containers
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          curl -fsS localhost:8080/ | grep -q "<title>Lakify</title>"
          curl -fsS localhost:8080/api/listings | grep -q '^\['
          docker exec api node -e "fetch('http://127.0.0.1:3000/version').then(r=>r.json()).then(v=>{console.log(v);process.exit(v.commit==='$SHORT_SHA'?0:1)})"
          test "$(docker exec api id -u)" != "0"
          test "$(docker exec web id -u)" != "0"
          echo "Container smoke tests passed"

      - name: Check graceful shutdown
        run: |
          docker stop --time 10 api
          test "$(docker inspect --format '{{.State.ExitCode}}' api)" = "0"
          docker logs api 2>&1 | grep -q "SIGTERM received"

      - name: Show container logs on failure
        if: failure()
        run: docker logs api; docker logs web

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FR6 / NFR3: one immutable tag per commit, so every deployed version
      # can be traced to the code it was built from.
      - name: Publish images tagged with the commit
        env:
          REG: ${{ steps.meta.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for name in lakify-api lakify-web; do
            docker push "$REG/$name:$TAG"
          done

  # ---------------------------------------------------------------------------
  deploy:
    name: 3. Deploy, verify and roll back
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # pull the images and move the "stable" tag

    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
      FAULT_MODE: ${{ github.event.inputs.fault || 'none' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the new version and the last stable version
        id: images
        run: |
          reg="${REGISTRY,,}"
          echo "reg=$reg" >> "$GITHUB_OUTPUT"
          for name in lakify-api lakify-web; do
            docker pull "$reg/$name:$TAG"
          done
          # On the very first run there is no stable version yet; the new
          # version then also serves as the baseline it is rolled out over.
          if docker pull "$reg/lakify-api:stable" && docker pull "$reg/lakify-web:stable"; then
            echo "first_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No stable version yet (first deployment); using the new version as the baseline"
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            for name in lakify-api lakify-web; do
              docker tag "$reg/$name:$TAG" "$reg/$name:stable"
            done
          fi

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: lakify
          wait: 120s

      - name: Load images into the cluster
        env:
          REG: ${{ steps.images.outputs.reg }}
        run: |
          kind load docker-image --name lakify \
            "$REG/lakify-api:$TAG" "$REG/lakify-web:$TAG" \
            "$REG/lakify-api:stable" "$REG/lakify-web:stable"

      # NFR6: the database password is a GitHub Actions secret (DB_PASSWORD),
      # passed to the cluster as a Kubernetes Secret. If the secret is not
      # configured, a random one-off password is used for this run's cluster.
      - name: Create Kubernetes Secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          password="${DB_PASSWORD:-$(openssl rand -hex 16)}"
          echo "::add-mask::$password"
          kubectl create namespace lakify
          kubectl -n lakify create secret generic lakify-db --from-literal=password="$password"
          kubectl -n lakify create secret generic lakify-grafana --from-literal=admin-password="$(openssl rand -hex 16)"

      - name: Deploy, verify and roll back on failure
        env:
          API_IMAGE: ${{ steps.images.outputs.reg }}/lakify-api:${{ env.TAG }}
          WEB_IMAGE: ${{ steps.images.outputs.reg }}/lakify-web:${{ env.TAG }}
          EXPECTED_SHA: ${{ env.SHORT_SHA }}
          ROLLOUT_TIMEOUT: 90s
          RESULTS_FILE: deploy-results.json
        run: bash .github/scripts/deploy-verify.sh

      # Only a version that passed every check becomes the new rollback target.
      - name: Tag the verified version as stable
        env:
          REG: ${{ steps.images.outputs.reg }}
        run: |
          for name in lakify-api lakify-web; do
            docker tag "$REG/$name:$TAG" "$REG/$name:stable"
            docker push "$REG/$name:stable"
          done
          echo "\`$TAG\` is now the stable version" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-results
          path: deploy-results.json
          if-no-files-found: ignore

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl -n lakify get all,pvc -o wide || true
          kubectl -n lakify describe pods || true
          kubectl -n lakify logs -l app.kubernetes.io/part-of=lakify --all-containers --tail=80 --prefix || true
          kubectl -n lakify get events --sort-by=.lastTimestamp || true
