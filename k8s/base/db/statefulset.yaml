apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lakify-db
  labels:
    app.kubernetes.io/name: lakify-db
    app.kubernetes.io/component: database
spec:
  serviceName: lakify-db
  # A single replica: PostgreSQL replication is out of scope (see thesis 1.4).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lakify-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakify-db
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # The Alpine PostgreSQL image's "postgres" user is uid/gid 70. Running
      # as that user from the start (instead of starting as root and
      # switching) is what the restricted Pod Security Standard requires.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: lakify
            - name: POSTGRES_USER
              value: lakify
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakify-db
                  key: password
            # A subdirectory, because the volume's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lakify", "-d", "lakify", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lakify", "-d", "lakify", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: lakify-db-init
        - name: run # socket and lock files; the root filesystem is read-only
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # Each replica gets its own persistent volume, kept when the pod is replaced.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
