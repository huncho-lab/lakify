apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lakify

labels:
  - pairs:
      app.kubernetes.io/part-of: lakify
      app.kubernetes.io/component: api
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: ghcr.io/huncho-lab/lakify-api
    newTag: latest
