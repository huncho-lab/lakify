apiVersion: v1
kind: Namespace
metadata:
  name: lakify
  labels:
    # Kubernetes Pod Security Standards: refuse any pod that runs as root,
    # can escalate privileges, keeps Linux capabilities or skips seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
