apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakify-api
  labels:
    app.kubernetes.io/name: lakify-api
    app.kubernetes.io/component: api
spec:
  # Two replicas: the API is stateless (listings live in PostgreSQL), so
  # any replica can answer any request and either can be replaced.
  replicas: 2
  revisionHistoryLimit: 5
  # If a new version is not ready within this time, Kubernetes marks the
  # rollout as failed (the pipeline then rolls back).
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: lakify-api
  # Zero-downtime rollouts: start a new pod and wait until it is ready
  # before an old one is removed. A version that never becomes ready
  # therefore never receives traffic.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakify-api
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/huncho-lab/lakify-api # tag set by kustomize / the pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: lakify-api-config
          env:
            - name: PORT
              value: "3000"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lakify-db
                  key: password
          # Startup: give Node up to 30 s to boot before liveness checks begin.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: restart the container if the process stops answering.
          # Deliberately does not check the database, so a database outage
          # does not cause the API pods to be restarted over and over.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: only send traffic once the API can reach the database.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi # request bodies may be up to 5 MB of photo data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
